site_name: Advanced Higher Computer Science

nav:
    - Home: 'index.md'
    - Software Design and Development:
      - Analysis:
        - Feasability Studies: '1.1-feasability-studies.md'
        - Project Planning: '1.2-project-planning.md'
        - Requirement Specifications: '1.3-requirement-specifications.md'
        - Unified Modelling Language (UML): 1.4-uml.md
      - Implementation:
        - Arrays and Records:
          - Parrallel Arrays: '3.1-parallel-1d-arrays.md'
          - Records: '3.2-records.md'
          - Arrays of Records: '3.3-arrays-of-records.md'
          - 2d Arrays: '3.4-2d-arrays.md'
        - Object Orientated Programming:
          - Object: '4.1-objects.md'
          - Arrays of Objects: '3.5-arrays-of-objects.md'
          - Sub-classes: '4.3-sub-class.md'
          - Encapsulation: '4.4-encapsulation.md'
          - Polymorphism: '4.5-polymorphism.md'
          - Example: '4.6-complete-working-example.md'
        - SQL and Python: '5.1-sqlite-with-python.md'
        - Searches and Sorts:
          - Binary Search: '6.1-binary-search.md'
          - Insertation Sort: '6.2-insertation-sort.md'
          - Bubble Sort: '6.3-bubble-sort.md'
        
      
markdown_extensions:
      - admonition
      - pymdownx.details
      - def_list
      - pymdownx.critic
      - pymdownx.caret
      - pymdownx.keys
      - pymdownx.mark
      - pymdownx.tilde
      - attr_list
      - md_in_html    
      - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - pymdownx.superfences
      - pymdownx.tabbed:
          alternate_style: true
      - pymdownx.highlight:
          use_pygments: true
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
      - pymdownx.inlinehilite
      - pymdownx.snippets
      
theme:
  name: material
  font:
    text: Quicksand
  palette:
    scheme: default
    primary: blue
    accent: deep orange
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes 
    - navigation.path
    #- navigation.footer
    - navigation.tabs
#plugins:
  #- glightbox

copyright: Copyright &copy; 2025 Pixel&Wood Computer Science Tuition

extra_css:
  - Styles/extra.css

extra_javascript:
  - scripts/extra.js
    
